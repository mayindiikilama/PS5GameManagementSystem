services:

  gamecatalogdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ps5-gamecatalog-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PS5GamePass123!"
    ports:
      - "14331:1433"
    volumes:
      - gamecatalogdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PS5GamePass123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  librarydb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ps5-library-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PS5LibraryPass123!"
    ports:
      - "14332:1433"
    volumes:
      - librarydata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PS5LibraryPass123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gamecatalogservice:
    build:
      context: .
      dockerfile: SIGameCatalogueService/Dockerfile
    container_name: ps5-gamecatalog-service
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=gamecatalogdb,1433;Database=GameCatalogDB;User Id=sa;Password=PS5GamePass123!;TrustServerCertificate=True;"
    depends_on:
      gamecatalogdb:
        condition: service_healthy

  libraryservice:
    build:
      context: .
      dockerfile: SILibraryService/Dockerfile
    container_name: ps5-library-service
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=librarydb,1433;Database=LibraryDB;User Id=sa;Password=PS5LibraryPass123!;TrustServerCertificate=True;"
      GameCatalogService__BaseUrl: "http://gamecatalogservice:8080"
    depends_on:
      librarydb:
        condition: service_healthy
      gamecatalogservice:
        condition: service_started

volumes:
  gamecatalogdata:
  librarydata: